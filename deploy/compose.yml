# The test setup: router, staff app, backend, migrations and database.
# Images are built from app-web and app-backend and tagged with RELEASE.
# Real settings come from .env next to this file, never from the repo.
name: graduationproject

services:
  router:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:11000:11000"
    volumes:
      - ./router/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, backend]

  web:
    image: graduationproject-web:${RELEASE:?set RELEASE}
    restart: unless-stopped

  backend:
    image: graduationproject-backend:${RELEASE:?set RELEASE}
    restart: unless-stopped
    environment:
      PORT: "11001"
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?set in .env}@database:5432/app
      PUBLIC_URL: ${PUBLIC_URL:?set in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      GMAIL_USER: ${GMAIL_USER:?set in .env}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?set in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    command: ["--wait", "--no-dump-schema", "--migrations-dir", "/db/migrations/core", "up"]
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?set in .env}@database:5432/app?sslmode=disable
    volumes:
      - ./migrations:/db/migrations:ro
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  database:
