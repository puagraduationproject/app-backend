# The test setup: router, staff app, backend and database.
# Images are built from app-web and app-backend and tagged with RELEASE.
# Real settings come from .env next to this file, never from the repo.
name: graduationproject

services:
  router:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:11000:11000"
    volumes:
      - ./router/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, backend]

  web:
    image: graduationproject-web:${RELEASE:?set RELEASE}
    restart: unless-stopped

  backend:
    image: graduationproject-backend:${RELEASE:?set RELEASE}
    restart: unless-stopped
    environment:
      PORT: "11001"
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?set in .env}@database:5432/app
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  database:
